services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: webxemphim
      MYSQL_USER: webxemphim
      MYSQL_PASSWORD: webxemphim
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    image: lemanhcuong204/webxemphim:latest
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: webxemphim
      DB_PASSWORD: webxemphim
      DB_NAME: webxemphim
      JWT_SECRET: change_me_in_production
      ADMIN_EMAIL: admin@cinema.vn
      ADMIN_PASSWORD: admin123
      ADMIN_NAME: Cinema Admin
    ports:
      - "3001:3000"
    depends_on:
      - db

volumes:
  mysql_data: